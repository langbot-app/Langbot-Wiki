name: V3 archive documentation
on:
  pull_request:
    branches: [v3]
  push:
    branches: [v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm test
